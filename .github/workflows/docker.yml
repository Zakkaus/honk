name: Docker

# The image repackages the published release archives, so it is built when a
# release is published, not when the tag creates the draft.
on:
  release:
    types: [prereleased, released]
  workflow_dispatch:
    inputs:
      version:
        description: Published release version without v, such as 0.1.0-beta.4
        required: true
      push:
        description: Push the image to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  docker:
    name: image
    # Debug releases are not images.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tags
        id: prep
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image=daeuniverse/honk
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            version=${RELEASE_TAG#v}
          else
            version=$INPUT_VERSION
            # A manual run cannot tell a pre-release apart, so it never moves latest.
            PRERELEASE=true
          fi
          tags="$image:$version"
          # Pre-releases never get latest.
          [[ "$PRERELEASE" == true ]] || tags+=$'\n'"$image:latest"
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: github.event_name == 'release' || inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: HONK_VERSION=${{ steps.prep.outputs.version }}
          push: ${{ github.event_name == 'release' || inputs.push }}
          tags: ${{ steps.prep.outputs.tags }}
